ContactCreate:
  type: object
  required:
    - name
    - email
    - phone
  properties:
    name:
      type: string
      example: John Doe
    email:
      type: string
      example: john@example.com
    phone:
      type: string
      example: '+380991234567'

ContactUpdate:
  type: object
  properties:
    name:
      type: string
      example: John Doe
    email:
      type: string
      example: john@example.com
    phone:
      type: string
      example: '+380991234567'
