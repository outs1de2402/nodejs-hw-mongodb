type: object
properties:
  _id:
    type: string
  name:
    type: string
  phoneNumber:
    type: string
  email:
    type:
      - string
      - 'null'
  isFavourite:
    type: boolean
  contactType:
    type: string
    enum: [personal, home, work]
  photo:
    type: string
  userId:
    type: string
  createdAt:
    type: string
  updatedAt:
    type: string
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
