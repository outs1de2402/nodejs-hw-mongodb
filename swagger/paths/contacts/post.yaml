tags:
  - Contacts
summary: Створити новий контакт
operationId: createContact
description: Додає новий контакт користувача
security:
  - cookieAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
          phoneNumber:
            type: string
          email:
            type: string
          isFavourite:
            type: boolean
          contactType:
            type: string
            enum: [work, home, personal]
          photo:
            type: string
            format: binary
responses:
  '201':
    description: Створено
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Contact.yaml
  '400':
    description: Validation error
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Error.yaml
