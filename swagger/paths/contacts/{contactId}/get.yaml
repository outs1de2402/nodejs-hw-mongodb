tags:
  - Contacts
summary: Отримати контакт за ID
operationId: getContactById
description: Повертає один контакт користувача
security:
  - cookieAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    description: ID контакту
responses:
  '200':
    description: Знайдений контакт
    content:
      application/json:
        schema:
          allOf:
            - $ref: ../../../components/schemas/ApiResponse.yaml
            - type: object
              properties:
                data:
                  $ref: ../../../components/schemas/Contact.yaml
  '404':
    description: Контакт не знайдено
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/Error.yaml
