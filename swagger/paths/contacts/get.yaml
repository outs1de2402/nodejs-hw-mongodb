tags:
  - Contacts
summary: Отримати всі контакти
operationId: getAllContacts
description: Повертає список контактів з пагінацією
security:
  - cookieAuth: []
parameters:
  - in: query
    name: page
    schema: { type: integer }
    example: 1
  - in: query
    name: perPage
    schema: { type: integer }
    example: 10
  - in: query
    name: sortBy
    schema: { type: string }
    example: name
  - in: query
    name: sortOrder
    schema: { type: string, enum: [asc, desc] }
    example: asc
  - in: query
    name: type
    schema: { type: string, enum: [work, home, personal] }
  - in: query
    name: isFavourite
    schema: { type: boolean }
responses:
  '200':
    description: Список контактів
    content:
      application/json:
        schema:
          allOf:
            - $ref: ../../components/schemas/ApiResponse.yaml
            - type: object
              properties:
                data:
                  type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: ../../components/schemas/Contact.yaml
                    pagination:
                      $ref: ../../components/schemas/Pagination.yaml
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/Error.yaml
