post:
  tags:
    - Contacts
  summary: Створити новий контакт
  operationId: createContact
  description: Додає новий контакт користувача
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            phone:
              type: string
            photo:
              type: string
              format: binary
  responses:
    '201':
      description: Контакт створено
      content:
        application/json:
          schema:
            $ref: ../../components/contact.yaml
